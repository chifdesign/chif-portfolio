<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'KoPub Dotum';src:url(fonts/KoPubDotum-Light.woff2) format('woff2');font-weight:300 400;font-display:swap}
@font-face{font-family:'KoPub Dotum';src:url(fonts/KoPubDotum-Medium.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'KoPub Dotum';src:url(fonts/KoPubDotum-Bold.woff2) format('woff2');font-weight:600 800;font-display:swap}
:root{
  --bg:#f6f5f2; --ink:#111; --mute:#8a8984; --line:#111;
  --accent:#ff5a1f; --glass:rgba(255,255,255,.42);
  --ease:cubic-bezier(.22,.8,.16,1);
  --ui:'Inter Tight','KoPub Dotum',system-ui,sans-serif;
  --serif:var(--ui);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:400 11px/1.4 var(--ui);-webkit-font-smoothing:antialiased;transition:background .8s var(--ease),color .6s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.up{text-transform:uppercase;letter-spacing:.06em}
.hov{position:relative}
.hov::after{content:"";position:absolute;left:0;right:100%;bottom:-2px;height:1px;background:currentColor;transition:right .35s var(--ease)}
.hov:hover::after,.hov.on::after{right:0}

#c-segs{margin-bottom:26px}
#c-fields{grid-template-columns:110px 1fr;max-width:420px;row-gap:5px}
/* ===== section themes ===== */
body[data-sec=consulting]{background:#0b0b0b;color:#e9e8e4}
body[data-sec=design]{background:#ebebe9}
body[data-sec=design].reel-dark{background:#0b0b0b}
body[data-sec=consulting] .logo img{filter:invert(1)}

/* ===== blob + header ===== */
#blob{position:fixed;left:0;top:0;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,var(--accent) 0,var(--accent) 36%,transparent 70%);
  filter:blur(18px);opacity:.9;pointer-events:none;z-index:32;transition:background .9s var(--ease),opacity .6s;will-change:transform}
body[data-sec=consulting] #blob{opacity:0}
body[data-sec=design] #blob,body[data-sec=strategy] #blob{opacity:0}
.cover.s-strategy::before{display:none}
header{position:fixed;inset:0 0 auto 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;padding:24px 34px;z-index:33;pointer-events:none}
header>*{pointer-events:auto}
.logo{display:block;width:60px;position:relative}
.logo img{width:100%;display:block;transition:filter .6s}
nav.sections{display:flex;gap:22px;align-items:center;padding-top:4px}
nav.sections .lbl{opacity:.5}
nav.sections button sup{font-size:8px;margin-left:2px;opacity:.5;letter-spacing:0}
nav.sections button.on{color:inherit}
.meta-r{justify-self:end;text-align:right;padding-top:4px}
#viewing{color:inherit;max-width:32vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .6s}

footer{position:fixed;inset:auto 0 0 0;display:flex;justify-content:space-between;padding:20px 34px;z-index:22;pointer-events:none}
footer>div{display:flex;gap:26px;pointer-events:auto}
body[data-sec=design] footer{display:none}

/* ===== sections ===== */
.sec{position:fixed;inset:0;opacity:0;visibility:hidden;filter:blur(10px);transition:opacity .7s var(--ease),filter .8s var(--ease),visibility 0s .8s}
.sec.on{opacity:1;visibility:visible;filter:none;transition:opacity .8s var(--ease),filter .9s var(--ease),visibility 0s}

/* ---------- CONSULTING (dark glass sheet) ---------- */
.c-bg{position:absolute;inset:-10%;overflow:hidden}
.c-bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(48px) saturate(1.25);opacity:0;transform:scale(1.15);transition:opacity 1.2s var(--ease),transform 6s linear}
.c-bg img.on{opacity:.9;transform:scale(1.05)}
.c-bg i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.45;animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(8vw,-6vh) scale(1.2)}}
.c-card{position:absolute;left:8.5vw;right:8.5vw;top:14vh;bottom:11vh;border-radius:14px;overflow:hidden;
  background:rgba(120,118,114,.34);-webkit-backdrop-filter:blur(30px) saturate(1.1);backdrop-filter:blur(30px) saturate(1.1);
  display:grid;grid-template-columns:1fr 1fr;color:rgba(255,255,255,.78);transition:background .6s,color .6s}
.c-card.light{background:rgba(240,239,235,.62);color:#1a1a1a}
.c-col{padding:14px 18px;overflow:auto;scrollbar-width:none}
.c-col::-webkit-scrollbar{display:none}
.c-lead{font:500 clamp(17px,1.55vw,22px)/1.2 var(--ui);letter-spacing:-.01em;max-width:30em;word-break:keep-all}
.c-lead .ko{display:block;margin-top:10px;font-size:.62em;line-height:1.55;opacity:.7;font-weight:400}
.c-mini{margin:34px 0 0 10px;font-size:8.5px;opacity:.75;display:grid;gap:10px;max-width:220px}
.c-mini .mode button{opacity:.55;margin-left:4px}
.c-mini .mode button.on{opacity:1;text-decoration:underline;text-underline-offset:2px}
.c-btns{display:flex;gap:2px;align-items:center}
.c-btns .mv{font-size:12px;margin-left:-14px;width:12px;opacity:.7}
.c-btns button{background:rgba(255,255,255,.18);border-radius:3px;padding:6px 8px;min-width:56px;text-align:left;font-size:10.5px;transition:background .25s}
.c-card.light .c-btns button{background:rgba(0,0,0,.08)}
.c-btns button:hover{background:rgba(255,255,255,.34)}
.c-h{font:500 clamp(15px,1.25vw,18px)/1.25 var(--ui);margin:0 0 18px;letter-spacing:-.005em;word-break:keep-all}
.c-h.big{margin-top:18px}
.c-list{display:grid;grid-template-columns:62px 1fr;row-gap:2px;font-size:10.5px;margin-bottom:24px;max-width:340px}
.c-seg{display:grid;grid-template-columns:62px 1fr;font-size:10.5px;margin-bottom:12px;max-width:340px;word-break:keep-all}
.c-cases{margin-bottom:26px;max-width:420px}
.c-case{display:grid;grid-template-columns:62px 1fr auto;font-size:10.5px;padding:5px 0;border-top:1px solid rgba(255,255,255,.14);cursor:pointer;transition:padding .35s var(--ease),color .25s}
.c-card.light .c-case{border-color:rgba(0,0,0,.12)}
.c-case:last-child{border-bottom:1px solid rgba(255,255,255,.14)}
.c-case:hover{padding-left:8px;color:#fff}
.c-card.light .c-case:hover{color:#000}
.c-case .y{opacity:.55}
.c-brands{font-size:10.5px;line-height:1.45}

/* ---------- STRATEGY (carousel + glass window) ---------- */
#stage{position:absolute;inset:0;touch-action:pan-y}
.slide{position:absolute;top:50%;left:0;height:58vh;transition:transform 1s var(--ease),opacity .8s var(--ease),filter .8s;will-change:transform;cursor:pointer}
.slide .imgs{position:relative;height:100%}
.slide .imgs img{height:100%;width:auto;display:block;user-select:none;-webkit-user-drag:none;position:absolute;inset:0;opacity:0;transition:opacity .6s var(--ease)}
.slide .imgs img.show{position:relative;opacity:1}
.slide.far{opacity:0;pointer-events:none}
.slide.side{filter:saturate(.85)}
.cover{height:100%;aspect-ratio:4/5;position:relative;overflow:hidden;background:#fbfaf7;border:1px solid #111;display:flex;flex-direction:column;justify-content:space-between;padding:22px;color:#111}
.cover::before{content:"";position:absolute;width:78%;aspect-ratio:1;border-radius:50%;right:-20%;top:20%;background:var(--c);filter:blur(34px);opacity:.85}
.cover>*{position:relative}
.cover .k{display:flex;justify-content:space-between;gap:10px}
.cover h3{font:500 clamp(24px,3.2vh,38px)/1.1 var(--ui);letter-spacing:-.02em}
.cover h3 i{font-style:normal;font-weight:400;opacity:.55;font-size:.5em}
.cover .n{font:500 clamp(60px,12vh,130px)/.8 var(--ui);letter-spacing:-.05em}
.arrow{position:absolute;top:50%;left:0;z-index:6;width:34px;height:34px;margin-top:-17px;display:grid;place-items:center;font-size:20px;transition:transform .9s var(--ease),opacity .3s}
.arrow:hover{opacity:.5}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.15);backdrop-filter:blur(16px) saturate(1.15);border:1px solid var(--line);color:#111}
#panel{position:absolute;z-index:10;width:min(400px,34vw);right:7vw;top:50%;transform:translateY(-50%)}
#panel.dragged,.win.dragged{transform:none!important}
.row{border-bottom:1px solid var(--line);display:flex;min-height:30px;align-items:stretch}
.row:last-child{border-bottom:0}
.row>*{padding:8px 10px;display:flex;align-items:center}
.row .grow{flex:1}
.row .split{flex:1;border-right:1px solid var(--line)}
.row .split:last-child{border-right:0}
.bar{cursor:grab;user-select:none}
.bar:active{cursor:grabbing}
.bar .handle{flex:1;justify-content:center;opacity:.45;letter-spacing:.3em}
#p-title{font:500 18px/1.2 var(--ui);letter-spacing:-.01em;padding:12px 10px;display:block}
#p-title small{display:block;font:400 13px/1.3 var(--ui);color:var(--mute);margin-top:3px}
.cell-k{display:block;color:var(--mute);font-size:9.5px;margin-bottom:3px}
.stack{display:block!important}
#p-next{background:#cfcecb;justify-content:center;transition:background .3s,color .3s}
#p-next:hover{background:#111;color:#fff}
#p-desc{display:block;padding:12px 10px;font-size:11.5px;line-height:1.55;word-break:keep-all}
#p-desc p+p{margin-top:9px}
.m span{color:var(--mute)}
.dots{display:flex;gap:5px}
.dots button{width:9px;height:9px;border:1px solid #111}
.dots button.on{background:#111}
#panel.min .body{display:none}
.swap{animation:swap .55s var(--ease)}
@keyframes swap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}


/* strategy editorial card */
.ed{height:100%;aspect-ratio:3/2;container-type:size;position:relative;overflow:hidden;background:#a9a6a0;color:#f6f4ef;display:flex;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.ed-bg{position:absolute;inset:0}
.ed-bg img,.ed-bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s var(--ease);filter:saturate(.5) brightness(.6) contrast(.92)}
.ed-bg img.show,.ed-bg video.show{opacity:1}
.ed-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 45% 55%,rgba(40,38,35,.38),rgba(40,38,35,.12) 70%),linear-gradient(180deg,rgba(40,38,35,.1),rgba(40,38,35,.35))}
.ed h3,.ed-body,.ed-mid,.ed-top,.ed-more{text-shadow:0 1px 14px rgba(0,0,0,.25)}
.ed-main{position:relative;flex:1;display:flex;flex-direction:column;padding:4.2% 6% 4.2% 9%;min-width:0}
.ed-top{display:grid;grid-template-columns:1fr auto auto;gap:0 13%;font-size:clamp(9px,3.6cqh,19px)}
.ed-mid{margin-top:auto;text-align:center;font-size:clamp(8px,2.8cqh,15px);line-height:1.5}
.ed-mid .sb{margin-top:.5em}
.ed-mid h3{font:300 clamp(18px,13.5cqh,84px)/1.02 var(--ui);letter-spacing:-.025em;margin:.25em 0 .3em;word-break:keep-all}
.ed-body{font-size:clamp(8px,2.7cqh,13.5px);line-height:1.38;text-align:justify;hyphens:auto;word-break:keep-all;max-height:7.2em;overflow:hidden}
.ed-body b{font-weight:600}
.ed-more{align-self:flex-start;margin-top:auto;padding-top:1.4em;font-size:clamp(8px,2.8cqh,15px);font-weight:600;color:inherit}
.ed-more:hover{opacity:.6}
.ed-strip{position:relative;width:5.6%;min-width:30px;background:#f1eee8;color:#111;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:4.2% 0;font-size:clamp(9px,3.6cqh,19px)}
@container (max-height:340px){.ed-body{display:none}.ed-strip span:nth-child(2){display:none}.ed-mid .sb{display:none}}
.ed-strip span{writing-mode:vertical-rl;white-space:nowrap}
.ed-logo{width:clamp(6px,1.7cqh,11px);height:auto;display:block}
.slide.side .ed{filter:saturate(.7)}

/* strategy scrub bar */
.scrub{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);width:min(560px,70vw);z-index:8;user-select:none;touch-action:none}
.scrub-track{position:relative;height:26px;display:flex;align-items:center;cursor:pointer}
.scrub-track::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#111;opacity:.25}
.scrub-fill{position:absolute;left:0;top:50%;height:2px;margin-top:-1px;background:#111;transition:width .6s var(--ease)}
.scrub-tick{position:absolute;top:50%;width:1px;height:9px;margin-top:-4.5px;background:#111;opacity:.4}
.scrub-knob{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#111;cursor:grab;transition:left .6s var(--ease),transform .2s}
.scrub.drag .scrub-knob,.scrub.drag .scrub-fill{transition:none}
.scrub.drag .scrub-knob{cursor:grabbing;transform:scale(1.3)}
.scrub-labels{display:flex;justify-content:space-between;margin-top:4px;font-size:9.5px}
.scrub-labels button{opacity:.4;transition:opacity .25s;white-space:nowrap}
.scrub-labels button.on,.scrub-labels button:hover{opacity:1}
@media (max-width:820px){.scrub{bottom:auto;top:calc(36% + 29vw + 14px);width:84vw}.scrub-labels button span{display:none}}
/* ---------- DESIGN (squircle grid) ---------- */
#s-design[hidden]{display:none}
#s-design{overflow:auto;scrollbar-width:thin}
.d-wrap{padding:96px 14px 70px;max-width:1500px;margin:0 auto}
.d-filters{display:flex;gap:6px;margin:0 2px 12px;flex-wrap:wrap;justify-content:flex-end}
.d-filters button{background:#d9d9d6;border-radius:999px;padding:4px 10px;font-size:9.5px;transition:background .25s,color .25s}
.d-filters button.on,.d-filters button:hover{background:#111;color:#fff}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 14px}
.d-card{opacity:0;transform:translateY(24px);transition:opacity .9s var(--ease),transform 1s var(--ease)}
.d-card.in{opacity:1;transform:none}
.d-card.hide{display:none}
.sq{display:block;position:relative;aspect-ratio:16/9;border-radius:0;overflow:hidden;cursor:pointer;background:#ddd;isolation:isolate}
.sq .bgb{display:none}
.sq .fg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.1s var(--ease),opacity .5s}
.sq:hover .fg{transform:scale(1.04)}
#d-grid .sq .pill{display:none}
.sq .cnt{position:absolute;right:6%;bottom:5%;z-index:2;color:#fff;font-size:9px;opacity:0;transition:opacity .3s;mix-blend-mode:difference}
.sq:hover .cnt{opacity:1}
.d-ig{position:fixed;left:14px;right:14px;bottom:12px;z-index:30;display:flex;justify-content:space-between;align-items:center;background:rgba(17,17,17,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;border-radius:14px;padding:13px 18px;font-size:10px;transition:background .3s}
body:not([data-sec=design]) .d-ig,body.intro-on .d-ig{display:none!important}
body.reel-on:not(.reel-dark) .d-ig{background:rgba(17,17,17,.82)}
.d-ig:hover{background:var(--accent)}
body[data-sec=design] header{background:#ebebe9;padding-bottom:18px}
#ig-feed:empty{display:none}
.sq-ph{position:absolute;inset:0;background:#111;color:#f3f1ec;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.sq-ph strong{font:500 clamp(28px,4.4vw,64px)/1 var(--ui);letter-spacing:.08em}
.sq-ph span{font-size:10px;opacity:.6}
.d-txt{margin-top:0;background:#e1e1de;border-radius:0;padding:12px 14px;font-size:clamp(12px,1vw,14px);line-height:1.35;word-break:keep-all}
.d-txt b{font-weight:500}
.d-txt .s{display:block;margin-top:6px;font-size:9.5px;opacity:.55}


/* ===== intro splash ===== */
#intro{position:fixed;inset:0;z-index:100;background:#0b0b0b;color:#f3f1ec;overflow:hidden;cursor:pointer}
#intro.out{pointer-events:none}
#intro.gone{display:none}
#intro .i-top{position:absolute;left:34px;right:34px;top:26px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
#intro .i-top img{width:60px;filter:invert(1)}
#intro .i-top span{opacity:.55;padding-top:4px}
#intro .i-trail{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#intro .i-trail span{position:absolute;font:200 20px/1 var(--ui);transform:translate(-50%,-50%) rotate(var(--r));animation:trailOut 1.1s cubic-bezier(.22,.8,.16,1) forwards;opacity:.9}
@keyframes trailOut{to{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(calc(var(--r) * 2)) scale(.6)}}
#intro .i-word{transition:letter-spacing .4s var(--ease)}
#intro.holding .i-word{letter-spacing:.02em}
#intro.holding .i-slash{background:#fff;box-shadow:0 0 22px rgba(243,241,236,.6)}
#intro.holding{cursor:grabbing}
#intro .i-slash{position:absolute;left:50%;top:50%;width:2px;height:min(62vh,520px);background:#f3f1ec;transform:translate(-50%,-50%) rotate(24deg) scaleY(0);transform-origin:50% 50%;
  animation:slashIn .9s .15s cubic-bezier(.77,0,.18,1) forwards;transition:width 1s cubic-bezier(.77,0,.18,1),height 1s cubic-bezier(.77,0,.18,1)}
@keyframes slashIn{to{transform:translate(-50%,-50%) rotate(24deg) scaleY(1)}}
#intro .i-slash.tick{animation:none;transform:translate(-50%,-50%) rotate(24deg) scaleY(1)}
#intro .i-word{position:absolute;top:50%;transform:translateY(-50%);font:500 clamp(40px,8.4vw,132px)/.9 var(--ui);letter-spacing:-.045em;white-space:nowrap;mix-blend-mode:difference}
#intro .i-word.l{right:calc(50% + 7vw);text-align:right}
#intro .i-word.r{left:calc(50% + 7vw)}
#intro .i-word i{font-style:normal;display:inline-block;transition:transform .5s var(--ease),opacity .4s}
#intro .i-secs{position:absolute;left:34px;bottom:28px;display:grid;gap:4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
#intro .i-secs span{opacity:.25;transition:opacity .3s}
#intro .i-secs span.on{opacity:1}
#intro .i-secs span.on::before{content:"● ";font-size:7px;vertical-align:2px}
#intro .i-count{position:absolute;right:34px;bottom:22px;font:500 clamp(56px,9vw,140px)/.8 var(--ui);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
#intro .i-count small{font-size:1em;letter-spacing:-.05em;margin-left:.04em;opacity:.5}
#intro .i-bar{position:absolute;left:0;right:0;bottom:0;height:1px;background:rgba(243,241,236,.15)}
#intro .i-bar b{display:block;height:100%;width:0;background:#f3f1ec}
#intro .i-tag{position:absolute;left:0;right:0;top:calc(50% + min(31vh,260px) + 22px);text-align:center;font-size:11px;letter-spacing:.04em}
#intro .i-tag b{font-weight:600;letter-spacing:.08em}
#intro .fade{transition:opacity .5s}
#intro.zoom .fade{opacity:0}
#intro.zoom .i-slash{transition:width 1s cubic-bezier(.77,0,.18,1),height 1s cubic-bezier(.77,0,.18,1),transform 1s cubic-bezier(.77,0,.18,1);width:300vmax;height:300vmax;transform:translate(-50%,-50%) rotate(24deg) scaleY(1)!important}
#intro.done{opacity:0;transition:opacity .6s}
body.intro-on header,body.intro-on footer{opacity:0}
header,footer{transition:opacity .8s .3s}
@media (max-width:820px){#intro .i-word{font-size:10vw;transform:none}#intro .i-word.l{right:auto;left:24px;top:calc(50% - 18vh)}#intro .i-word.r{left:auto;right:24px;top:calc(50% + 12vh)}#intro .i-slash{height:42vh}#intro .i-tag{top:calc(50% + 21vh + 40px)}}

/* ===== custom cursor ===== */
@media (pointer:fine){
  html.cc,html.cc *{cursor:none!important}
  #cc-dot,#cc-ring{position:fixed;left:0;top:0;z-index:120;pointer-events:none;border-radius:50%;mix-blend-mode:difference}
  #cc-dot{width:6px;height:6px;margin:-3px 0 0 -3px;background:#fff}
  #cc-ring{width:34px;height:34px;margin:-17px 0 0 -17px;border:1px solid #fff;transition:width .35s var(--ease),height .35s var(--ease),margin .35s var(--ease),background .3s,border-color .3s,opacity .3s}
  html.cc-hover #cc-ring{width:64px;height:64px;margin:-32px 0 0 -32px;background:#fff;border-color:transparent}
  html.cc-hover #cc-dot{opacity:0}
  html.cc-down #cc-ring{width:22px;height:22px;margin:-11px 0 0 -11px}
  html.cc-out #cc-ring,html.cc-out #cc-dot{opacity:0}
  #cur{transform-origin:0 0;border-radius:999px;padding:4px 9px}
}

/* ===== DESIGN reel (scroll accordion) ===== */
#d-reel{--sq:min(82vh,50vw,900px);--previous-gap:32px;--inset:6px;--media-width:calc(var(--sq) + (var(--previous-gap) - var(--inset)) * 32 / 9);position:fixed;inset:0;overflow:hidden;background:#ebebe9;touch-action:none;user-select:none;transition:background .6s}
#d-reel.dark{background:#0b0b0b;color:#ebebe9}
body[data-sec=design].reel-on header{background:#ebebe9;transition:background .6s,color .6s}
body[data-sec=design].reel-dark header{background:#0b0b0b}
body[data-sec=design].reel-dark header{color:#ebebe9}
body[data-sec=design].reel-dark .logo img{filter:invert(1)}
body.reel-on #s-design .d-wrap{display:contents}
body.reel-on #d-grid{display:none}
body[data-sec=design].reel-dark #d-filters button{background:#303030;color:#eee}
body[data-sec=design].reel-dark #d-filters button:is(.on,:hover){background:#eee;color:#111}
body:not(.reel-on) #d-reel{display:none}
.r-title{position:absolute;left:34px;top:50%;transform:translateY(-50%);width:calc(50% - var(--media-width)/2 - 60px);font:400 clamp(20px,2vw,30px)/1.15 var(--ui);letter-spacing:-.02em;pointer-events:none;z-index:2;word-break:keep-all;max-height:calc(100% - 4px);overflow:hidden}
.r-title small{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;opacity:.5;margin-bottom:10px}
.r-row .lab.l{display:none}
.r-row{position:absolute;left:0;right:0;top:0;z-index:1;border-top:1px solid currentColor;border-color:rgba(17,17,17,.18);will-change:transform,height}
#d-reel.dark .r-row{border-color:rgba(235,235,233,.18)}
.r-row .lab{position:absolute;top:var(--inset);font-size:9.5px;letter-spacing:.04em;white-space:nowrap}
.r-row .lab.l{left:34px}.r-row .lab.r{right:34px;text-align:right;opacity:.6}
.r-row .im{position:absolute;left:50%;top:var(--inset);bottom:var(--inset);width:min(100%,var(--media-width));transform:translateX(-50%);overflow:hidden;cursor:pointer;z-index:2;display:flex;align-items:flex-start}
.r-row .im :is(img,video){width:100%;height:100%;max-height:min(calc(var(--media-width) * 9 / 16),56.25vw);object-fit:cover;display:block;transition:filter .4s}
@media (hover:hover) and (pointer:fine) and (prefers-reduced-motion:no-preference){
  .r-row .im :is(img,video){transition:transform .24s ease-out,filter .4s;transform-origin:50% 0}
  .r-row .im:hover :is(img,video){transform:scale(1.02)}
}
@media (max-width:820px){.r-row .lab{z-index:3;pointer-events:none;background:rgba(235,235,233,.88)}#d-reel.dark .lab{background:rgba(11,11,11,.88)}.r-row .lab.r{opacity:1}}
.r-row.act .im{z-index:2}
.r-row:not(.act) .im :is(img,video){filter:saturate(.85)}
.r-ctl{position:fixed;left:30px;top:84px;z-index:34;display:flex;gap:4px}
.r-ctl button{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;opacity:.4;transition:opacity .2s,background .2s}
.r-ctl button:hover{opacity:.8}
.r-ctl button.on{opacity:1;background:rgba(17,17,17,.08)}
.r-ctl svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.3}
.r-ctl svg .fill{fill:currentColor;stroke:none}
body.reel-dark .r-ctl{color:#ebebe9}
body.reel-dark .r-ctl button.on{background:rgba(235,235,233,.14)}
body[data-sec=design].reel-dark .d-txt{background:#222;color:#ebebe9}
body[data-sec=design].reel-dark .sq{background:#202020}
body:not([data-sec=design]) .r-ctl{display:none}
.r-hint{position:fixed;right:34px;bottom:24px;z-index:22;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.5}
body:not([data-sec=design]) .r-hint,body:not(.reel-on) .r-hint{display:none}
body.reel-dark .r-hint{color:#ebebe9}
@media (max-width:820px){#d-reel{top:var(--hh,104px);--sq:min(76vh,86vw,700px);--previous-gap:20px}.r-title{display:none}.r-row .lab.l{display:block}.r-ctl{top:auto;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(235,235,233,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:12px;padding:3px}body.reel-dark .r-ctl{background:rgba(20,20,20,.85)}.d-ig{bottom:62px}.d-wrap{padding-bottom:70px}.r-row .lab.l{left:14px}.r-row .lab.r{right:14px}}
/* ===== cursor / index / windows ===== */
#cur{position:fixed;left:0;top:0;z-index:40;pointer-events:none;padding:3px 6px;background:#111;color:#fff;font-size:9.5px;opacity:0;transition:opacity .2s;white-space:nowrap}
#cur.on{opacity:1}
#index{position:fixed;inset:0;z-index:30;background:rgba(246,245,242,.55);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);color:#111;
  padding:92px 34px 70px;overflow:auto;opacity:0;pointer-events:none;transition:opacity .45s var(--ease)}
#index.open{opacity:1;pointer-events:auto}
.ix-grid{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #111;background:rgba(255,255,255,.35)}
.ix-col{border-right:1px solid #111}
.ix-col:last-child{border-right:0}
.ix-h{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid #111;padding:10px}
.ix-h strong{font:500 22px/1 var(--ui);letter-spacing:-.01em;text-transform:none}
.ix-row{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:8px 10px;border-bottom:1px solid rgba(17,17,17,.15);cursor:pointer;transition:background .25s,padding .35s var(--ease)}
.ix-row:hover{background:#111;color:#fff;padding-left:16px}
.ix-row .c{color:#111;opacity:.45}
.ix-row:hover .c{color:#fff;opacity:.6}
#peek{position:fixed;left:0;top:0;z-index:31;width:200px;pointer-events:none;opacity:0;transition:opacity .2s;border:1px solid #111}
#peek.on{opacity:1}
#peek img{width:100%;display:block}
#peek .cover{height:auto;aspect-ratio:4/5;padding:12px}
#peek .cover h3{font-size:20px}#peek .cover .n{font-size:56px}

.win{position:fixed;z-index:35;width:min(520px,92vw);left:50%;top:50%;transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;
  transition:opacity .35s var(--ease),transform .5s var(--ease);max-height:84vh;display:flex;flex-direction:column}
.win.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.win .scroll{overflow:auto}
.win h2{font:500 28px/1.15 var(--ui);padding:16px 12px 14px;letter-spacing:-.01em}
.win h2 i{font-style:normal}
.win .txt{padding:12px;font-size:11.5px;line-height:1.6;word-break:keep-all}
.tbl{width:100%;border-collapse:collapse}
.tbl td{border-top:1px solid #111;padding:8px 12px;vertical-align:top}
.tbl td:first-child{width:34%;color:var(--mute)}

/* about tabs + record */
#about.wide{width:min(860px,94vw)}
.ab-tabs{display:flex;gap:2px;margin-right:14px}
.ab-tabs button{padding:3px 9px;border:1px solid transparent;opacity:.5;transition:opacity .2s}
.ab-tabs button.on{border-color:#111;opacity:1}.ab-tabs button:hover{opacity:1}
.sk-sum{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #111}
.sk-sum div{padding:12px;border-right:1px solid #111}.sk-sum div:last-child{border-right:0}
.sk-sum b{display:block;font:500 28px/1 var(--ui);letter-spacing:-.02em;margin-bottom:6px}
.sk-sum span{font-size:9.5px;opacity:.55;text-transform:uppercase;letter-spacing:.06em}
.sk-filter{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid #111}
.sk-filter button{padding:3px 9px;border:1px solid rgba(17,17,17,.25);border-radius:999px;font-size:9.5px;transition:background .2s,color .2s}
.sk-filter button.on,.sk-filter button:hover{background:#111;color:#fff;border-color:#111}
.sk-year{display:grid;grid-template-columns:150px 1fr;border-top:1px solid #111}
.sk-y{padding:12px;border-right:1px solid #111}
.sk-y b{display:block;font:500 26px/1 var(--ui);letter-spacing:-.02em}
.sk-y em{font-style:normal;display:block;margin-top:6px;font-size:10.5px;line-height:1.35}
.sk-y i{font-style:normal;display:inline-block;margin-top:6px;font-size:9px;border:1px solid #111;border-radius:999px;padding:1px 7px}
.sk-it{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 12px;border-bottom:1px solid rgba(17,17,17,.15);cursor:pointer;transition:background .25s}
.sk-it:last-child{border-bottom:0}
.sk-it:hover{background:rgba(255,255,255,.45)}
.sk-it .t{font-size:12px;font-weight:500}
.sk-it .t sup{font-size:8px;margin-left:4px;letter-spacing:.06em;border:1px solid #111;padding:0 4px;vertical-align:2px}
.sk-it .c{font-size:9.5px;opacity:.55;text-transform:uppercase;letter-spacing:.06em;align-self:start;padding-top:2px}
.sk-it .d{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:11px;line-height:1.5;max-height:0;overflow:hidden;opacity:0;transition:max-height .45s var(--ease),opacity .3s,margin .3s;word-break:keep-all}
.sk-it.open .d{max-height:140px;opacity:1;margin-top:6px}
.sk-it .d span{opacity:.5;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
@media (max-width:820px){.sk-sum{grid-template-columns:1fr 1fr}.sk-sum div:nth-child(2){border-right:0}.sk-sum div:nth-child(-n+2){border-bottom:1px solid #111}.sk-year{grid-template-columns:1fr}.sk-y{border-right:0;border-bottom:1px solid rgba(17,17,17,.15)}}
.win img.poster{width:100%;display:block;border-top:1px solid #111}
#copied{color:inherit}
#viewer{width:min(1040px,94vw);background:rgba(250,250,248,.78)}
.v-body{display:grid;grid-template-columns:1.5fr 1fr;min-height:0;flex:1}
.v-img{position:relative;border-right:1px solid #111;display:grid;place-items:center;background:rgba(255,255,255,.25);min-height:50vh;cursor:pointer;overflow:hidden}
.v-img img{max-width:100%;max-height:70vh;display:block;animation:swap .5s var(--ease)}
.v-img .cover{height:56vh}
.v-nav{position:absolute;top:50%;width:40px;height:40px;margin-top:-20px;border-radius:50%;background:rgba(17,17,17,.55);color:#fff;font-size:18px;display:grid;place-items:center;z-index:3;opacity:0;transition:opacity .25s,background .25s}
.v-img:hover .v-nav{opacity:1}.v-nav:hover{background:#111}
.v-nav.l{left:12px}.v-nav.r{right:12px}
.v-thumbs{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;border-top:1px solid #111;margin-top:auto;scrollbar-width:thin}
.v-thumbs button{flex:0 0 auto;width:52px;height:52px;padding:0;border:1px solid transparent;opacity:.55;transition:opacity .2s,border-color .2s;background:#ddd;display:grid;place-items:center;font-size:14px;overflow:hidden}
.v-thumbs button img{width:100%;height:100%;object-fit:cover;display:block}
.v-thumbs button.on,.v-thumbs button:hover{opacity:1;border-color:#111}
.v-count{font-size:9.5px;color:var(--mute);padding:6px 10px 0}
.v-txt{display:flex;flex-direction:column}
.v-txt .t{font:500 18px/1.2 var(--ui);padding:12px 10px;border-bottom:1px solid #111}
.v-txt .t small{display:block;font:400 13px/1.3 var(--ui);color:var(--mute);margin-top:3px}

body:not(.ready) .sec.on{opacity:0}

/* ===== mobile ===== */
@media (max-width:820px){
  header{grid-template-columns:auto 1fr;padding:18px 18px 12px;row-gap:12px}
  nav.sections{grid-column:1/-1;grid-row:2;gap:16px;padding-top:0}
  header .meta-r{grid-column:2;grid-row:1}
  nav.sections .lbl{display:none}
  #viewing{max-width:52vw}

  .c-card{left:12px;right:12px;top:calc(var(--hh,104px) + 6px);bottom:60px;grid-template-columns:1fr;overflow:auto}
  .c-col{overflow:visible}

  .arrow{display:none}
  #panel{left:12px!important;right:12px!important;width:auto;top:auto!important;bottom:56px;transform:none}
  #p-desc{max-height:17vh;overflow:auto}
  .d-wrap{padding-top:calc(var(--hh,104px) + 10px)}
  .d-grid{grid-template-columns:1fr}

  .v-body{grid-template-columns:1fr;overflow:auto}

}
/* The reel scrolls inside the frame below the Work controls. */
body[data-sec=design].reel-on #d-reel{border-top:1px solid rgba(17,17,17,.18)}
body[data-sec=design].reel-on #d-reel.dark{border-top-color:rgba(235,235,233,.18)}
body[data-sec=design]{
  --work-edge:34px;
  --work-controls-top:max(84px,var(--hh,72px));
  --work-control-size:30px;

}

}
body[data-sec=design] .r-ctl button{height:var(--work-control-size)}
body[data-sec=design]:not(.reel-on) #s-design{top:var(--work-content-top)}
body[data-sec=design] #d-reel{top:var(--work-content-top)}
body[data-sec=design] .d-wrap{padding-top:0}
@media(max-width:820px){

}
